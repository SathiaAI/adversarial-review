# CI for the adversarial-review skill itself: runs the mocked end-to-end suite.
# Least-privilege permissions and pinned actions, per this skill's own gate rules
# (references/gates.md, supply-chain hygiene).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run mocked end-to-end suite (no network, no keys)
        run: python tests/run_tests.py
