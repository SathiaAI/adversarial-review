# ai-defects gate — deeper verifier (port wrapper + pinned CLI) run in CI.
#
# The verifier is a PINNED CLI adopted BY COMMAND: its exact version + digest are private
# CI secrets and the binary is installed on the runner only (never committed, never a
# release asset, never named on a public surface). This is workflow_dispatch on purpose:
# the pin is operator-only, so a required always-on gate would fail-closed to BLOCKED on
# every PR until an operator supplies the secrets. The gate's PASS/FAIL/BLOCKED taxonomy
# is locked by the required test job (tests/run_tests.py: t_ai_defects_*). Dispatch this
# with the secrets set to run the real verify; dispatch it WITHOUT them to see the
# fail-closed BLOCKED path.
#
# Required secrets (set in repo/org Actions settings — internal, never in public docs):
#   AI_DEFECTS_PIN_VERSION   exact pinned version
#   AI_DEFECTS_PIN_DIGEST    sha256 of the pinned binary (optionally 'sha256:'-prefixed)
# Optional:
#   AI_DEFECTS_INSTALL_URL   where CI fetches the pinned binary (internal)
#   AI_DEFECTS_FETCH_TOKEN   bearer token for that fetch (never echoed)
name: ai-defects

on:
  workflow_dispatch:
    inputs:
      diff-ref:
        description: "Git range to scope the verify"
        default: "HEAD~1...HEAD"

permissions:
  contents: read

jobs:
  ai-defects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned verifier (digest-verified; runner path only)
        env:
          AI_DEFECTS_PIN_VERSION: ${{ secrets.AI_DEFECTS_PIN_VERSION }}
          AI_DEFECTS_PIN_DIGEST: ${{ secrets.AI_DEFECTS_PIN_DIGEST }}
          AI_DEFECTS_INSTALL_URL: ${{ secrets.AI_DEFECTS_INSTALL_URL }}
          AI_DEFECTS_FETCH_TOKEN: ${{ secrets.AI_DEFECTS_FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AI_DEFECTS_PIN_VERSION:-}" ] || [ -z "${AI_DEFECTS_PIN_DIGEST:-}" ]; then
            echo "::notice::ai-defects: pin secrets absent — the gate will record BLOCKED (fail-closed)."
            exit 0
          fi
          if [ -z "${AI_DEFECTS_INSTALL_URL:-}" ]; then
            echo "::notice::ai-defects: AI_DEFECTS_INSTALL_URL not set — cannot install; gate will be BLOCKED."
            exit 0
          fi
          dest="$RUNNER_TEMP/ai-defects-verifier"
          # Fetch to a runner-only path. A fetch failure (DNS/TLS/HTTP/etc.) must NOT abort
          # the job: leave AI_DEFECTS_BIN unset and exit 0 so the gate step still runs and
          # records BLOCKED (fail-closed), never a skipped/absent gate. With a token we do
          # NOT follow redirects (-L would forward the Authorization header to the redirect
          # host and leak the token); operators point the URL directly at the artifact.
          dl_failed=""
          if [ -n "${AI_DEFECTS_FETCH_TOKEN:-}" ]; then
            curl -fsS -H "Authorization: Bearer ${AI_DEFECTS_FETCH_TOKEN}" -o "$dest" "$AI_DEFECTS_INSTALL_URL" || dl_failed=1
          else
            curl -fsSL -o "$dest" "$AI_DEFECTS_INSTALL_URL" || dl_failed=1
          fi
          if [ -n "$dl_failed" ]; then
            echo "::notice::ai-defects: verifier download failed — gate will record BLOCKED (fail-closed)."
            rm -f "$dest"
            exit 0
          fi
          got="$(sha256sum "$dest" | awk '{print $1}')"
          want="$(printf '%s' "$AI_DEFECTS_PIN_DIGEST" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]' | sed 's/^sha256://')"
          if [ "$got" != "$want" ]; then
            echo "::error::ai-defects: pinned binary digest mismatch — refusing to install (values redacted)."
            rm -f "$dest"
            exit 0   # leave AI_DEFECTS_BIN unset -> the gate records BLOCKED, never runs an unpinned binary
          fi
          chmod 0755 "$dest"
          echo "AI_DEFECTS_BIN=$dest" >> "$GITHUB_ENV"
          echo "::notice::ai-defects: pinned verifier installed and digest-verified."

      - name: Run the ai-defects gate (records PASS/FAIL/BLOCKED; fail-closed)
        env:
          AI_DEFECTS_PIN_VERSION: ${{ secrets.AI_DEFECTS_PIN_VERSION }}
          AI_DEFECTS_PIN_DIGEST: ${{ secrets.AI_DEFECTS_PIN_DIGEST }}
          IN_DIFF_REF: ${{ github.event.inputs.diff-ref }}
        run: |
          set -euo pipefail
          # Attached --diff-ref= form: argparse rejects a separate "--diff-ref -x" (an
          # option-like value) and would abort this step here, before the diff-ref guard
          # below could record BLOCKED. The attached form accepts the value so an
          # option-prefixed diff-ref reaches the fail-closed BLOCKED path below.
          RUN_DIR="$(python scripts/panel.py init --risk NORMAL --dev-providers anthropic \
                       --diff-ref="$IN_DIFF_REF" | awk '/^initialized /{print $2; exit}')"
          test -n "$RUN_DIR" && test -d "$RUN_DIR"
          # Establish the scan scope from the diff-ref. Reject option-prefixed values, and
          # append `--` so the ref is parsed strictly as a revision/range: a bare pathspec
          # (e.g. "README.md") then FAILS to resolve instead of silently diffing a path to an
          # empty result the wrapper would read as an empty-diff PASS. Any resolution failure
          # is BLOCKED (fail-closed); a VALID range with no changed files is a legitimate PASS.
          case "$IN_DIFF_REF" in
            -*) diff_ref_bad=1 ;;
            *)  diff_ref_bad="" ;;
          esac
          if [ -n "$diff_ref_bad" ] || ! git diff --name-only "$IN_DIFF_REF" -- > "$RUN_DIR/changed_paths.txt"; then
            python scripts/gate.py record --run "$RUN_DIR" --name ai-defects --status BLOCKED \
              --summary "invalid diff-ref '$IN_DIFF_REF' -- not a resolvable revision/range; scan scope not established"
            echo "----- ai-defects ledger entry -----"
            cat "$RUN_DIR/gates/ai-defects.json"
            echo "::error::ai-defects gate: BLOCKED (invalid diff-ref; scan scope not established)"
            exit 1
          fi
          python scripts/gate.py plan --run "$RUN_DIR" --require ai-defects
          # The wrapper emits a tri-state exit; --exit-map records BLOCKED on exit 2. The
          # ledger status (not this step's exit) is the source of truth, so tolerate the
          # wrapper's own nonzero exit here and read the recorded status below.
          python scripts/gate.py run --run "$RUN_DIR" --name ai-defects \
            --exit-map "1=FAIL,2=BLOCKED,*=BLOCKED" -- \
            python scripts/ai_defects_verify.py \
              --run-dir "$RUN_DIR" --diff-file "$RUN_DIR/changed_paths.txt" || true
          echo "----- ai-defects ledger entry -----"
          cat "$RUN_DIR/gates/ai-defects.json"
          echo "AR_LEDGER=$RUN_DIR/gates/ai-defects.json" >> "$GITHUB_ENV"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUN_DIR/gates/ai-defects.json")"
          case "$status" in
            PASS)    echo "::notice::ai-defects gate: PASS" ;;
            FAIL)    echo "::error::ai-defects gate: FAIL (defects found) — see the ledger entry above"; exit 1 ;;
            BLOCKED) echo "::error::ai-defects gate: BLOCKED (fail-closed) — see the ai-defects ledger entry above for the reason"; exit 1 ;;
            *)       echo "::error::ai-defects gate: unexpected status '$status'"; exit 1 ;;
          esac

      - name: Upload ai-defects ledger entry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-defects-ledger
          path: .adversarial-review/*/gates/ai-defects.json
          if-no-files-found: warn
