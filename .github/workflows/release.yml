# Build and publish to PyPI on a version tag, via Trusted Publishing (OIDC) — no stored token.
# Cut a release per CONTRIBUTING.md ("Cutting a release"): bump pyproject.toml, move the
# CHANGELOG Unreleased section to the new version, then tag vX.Y.Z and push the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Fail if the built version does not match the pushed tag
        run: |
          # Trusted Publishing makes a PyPI release immutable — never publish a version that
          # disagrees with the tag that triggered it (a mistagged commit would otherwise ship
          # an incorrectly labeled release, or fail later with an opaque duplicate-version error).
          version="$(ls dist/*.whl | sed -E 's#.*/adversarial_review-([^-]+)-.*#\1#')"
          tag="${GITHUB_REF_NAME#v}"
          echo "built version: $version   pushed tag: $GITHUB_REF_NAME (-> $tag)"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME expects version '$tag' but the package is '$version' — bump pyproject.toml or fix the tag"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exercise the INSTALLED wheel at the declared floor (3.9) and current (3.12): a 3.10+
        # syntax or stdlib dependency must not ship in a wheel that advertises 3.9 support.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the wheel and run each console entry point
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import adversarial_review"
          # Actually invoke each generated command, not just `test -x`: a wrapper whose target
          # module fails to import is still executable but unusable, and the import above touches
          # none of the four entry-point modules.
          /tmp/venv/bin/ar-panel --help >/dev/null
          /tmp/venv/bin/ar-gate --help >/dev/null
          /tmp/venv/bin/ar-aggregate --help >/dev/null
          /tmp/venv/bin/ar-mcp </dev/null >/dev/null   # stdio server: EOF-driven clean startup

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi        # gate the publish behind a protected environment
    permissions:
      id-token: write        # OIDC for PyPI Trusted Publishing — no long-lived token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
