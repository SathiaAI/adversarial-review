# ILLUSTRATIVE SKETCH -- not a drop-in, deployment-ready file. It shows the three
# things that make a job "trusted" (trigger, checkout ref, secret scoping) for the
# policy-snapshot signer. It deliberately does NOT solve the remaining hard problem:
# getting this job's signature into the EXACT run directory the untrusted review
# job's `gate.py plan --waive` will later read. `policy_attest_bytes` binds a fresh
# run_id/run_nonce/directory-name generated by each `panel.py init` call, so a
# signature produced by a separate `panel.py init` call in a separate job/run
# directory cannot be reused for a DIFFERENT run's directory without an explicit
# hand-off mechanism (e.g. cross-workflow artifact passing, or a new CLI entry point
# that signs a *given* (run_id, run_nonce, risk) tuple against an independently
# resolved policy, without also creating its own run). Neither is built yet -- see
# docs/THREAT-MODEL.md, "cross-job signature hand-off" -- and this specific piece
# deserves its own design decision (a frontier-gate panel run, not a unilateral
# choice made while writing an example file) before it is built. Until it exists, a
# repo that needs waiver/NOT_APPLICABLE support with real job isolation does not yet
# have a fully-worked, deployment-ready two-job topology to copy -- only the pieces
# below and the guard in trusted_signer_guard_error() that keeps a single-job setup
# from silently signing PR-controlled policy.
#
# What IS real and shipped: a job configured like the `sign-policy` job below WILL
# be correctly recognized as trusted by trusted_signer_guard_error() (workflow_run
# trigger, AR_TRUSTED_SIGNER=1) and WILL sign a policy snapshot resolved from its own
# (base-ref) checkout -- into ITS OWN run directory. Wiring that signature into a
# different run directory is the open piece above.
name: adversarial-review-policy-signer

on:
  workflow_run:
    workflows: ["adversarial-review"]   # must match examples/adversarial-review.yml's `name:`
    types: [requested]

permissions:
  contents: read

jobs:
  sign-policy:
    # workflow_run jobs always run with THIS WORKFLOW FILE'S OWN ref (the base
    # branch), regardless of who or what triggered the originating workflow_run
    # event -- that is the isolation property this whole file depends on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No `ref:` override -- defaults to this workflow's own (base) ref, never
        # the triggering PR's branch, so .adversarial-review.yml/.json below is the
        # repo's OWN protected copy, not whatever the PR branch contains.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sign a policy snapshot from the protected base ref
        env:
          AR_TRUSTED_SIGNER: '1'                       # required -- see docs/THREAT-MODEL.md
          AR_SIGNER_CMD: ${{ secrets.AR_SIGNER_CMD }}  # set on THIS job's secrets only, never the
                                                        # review job in examples/adversarial-review.yml
        run: |
          python3 scripts/panel.py init --risk "${AR_RISK:-}" --dev-providers "${AR_DEV_PROVIDERS:-}"
          # Produces a signed policy.snapshot.sig under THIS job's own, freshly-created run
          # directory -- correctly isolated, correctly signed, but not yet connected to any
          # specific untrusted review run. See the file header.
