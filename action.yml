name: 'Adversarial Review'
description: >-
  Deterministic gate recording plus a machine-computed PASS/FAIL/BLOCKED release
  verdict (aggregate.py exit 0/1/2). Optionally runs the independent multi-model
  reviewer panel when an OpenRouter key is provided.
author: 'Paul Poulose'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  risk:
    description: >-
      Risk tier (NORMAL|SENSITIVE|CRITICAL). Empty resolves from the repo's
      .adversarial-review.yml policy file or AR_RISK.
    default: ''
  dev-providers:
    description: >-
      Comma list of provider families that developed/advised the change. Empty
      resolves from the policy file or AR_DEV_PROVIDERS.
    default: ''
  gates:
    description: >-
      Newline-separated "name=command" pairs, e.g. "unit=npm test". Each runs
      through gate.py so the exit code is recorded. Gate NAMES also form the
      --require list; empty falls back to the policy file's required_gates.
    default: ''
  fail-on:
    description: >-
      "blocked" (default) fails the job on FAIL or BLOCKED; "fail" fails only
      on FAIL, reporting BLOCKED as a warning (incremental-adoption mode).
    default: 'blocked'
  diff-ref:
    description: 'Git range reviewed by the panel (needs fetch-depth: 0).'
    default: 'origin/main...HEAD'
  product:
    description: 'Product/change label recorded in run.json.'
    default: ''
  openrouter-api-key:
    description: >-
      OpenRouter API key (pass a secret). When set, the independent reviewer
      panel runs over the diff. When empty, only deterministic gates are
      recorded — the aggregator will then report BLOCKED for missing panel
      coverage, which is the honest verdict for an un-reviewed change.
    default: ''

outputs:
  verdict:
    description: 'PASS, FAIL, or BLOCKED — exactly what aggregate.py computed.'
    value: ${{ steps.verdict.outputs.verdict }}
  exit-code:
    description: 'aggregate.py exit code: 0 PASS, 1 FAIL, 2 BLOCKED.'
    value: ${{ steps.verdict.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Initialize run and plan gates
      id: init
      shell: bash
      env:
        IN_RISK: ${{ inputs.risk }}
        IN_DEV: ${{ inputs.dev-providers }}
        IN_GATES: ${{ inputs.gates }}
        IN_PRODUCT: ${{ inputs.product }}
        IN_DIFF_REF: ${{ inputs.diff-ref }}
        AR_SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -euo pipefail
        args=(--diff-ref "$IN_DIFF_REF")
        [ -n "$IN_RISK" ] && args+=(--risk "$IN_RISK")
        [ -n "$IN_DEV" ] && args+=(--dev-providers "$IN_DEV")
        [ -n "$IN_PRODUCT" ] && args+=(--product "$IN_PRODUCT")
        # Capture the EXACT run directory init created (its first stdout line: "initialized <dir> ...").
        # Every later step pins to it with --run, so a repository-committed .adversarial-review/run-*
        # directory present in the checkout can never hijack the pipeline or forge a gate result.
        init_out="$(python "$AR_SCRIPTS/panel.py" init "${args[@]}")"
        printf '%s\n' "$init_out"
        run_dir="$(printf '%s\n' "$init_out" | awk '/^initialized /{print $2; exit}')"
        if [ -z "$run_dir" ] || [ ! -d "$run_dir" ]; then
          echo "::error::adversarial-review: could not resolve the run directory created by panel.py init"; exit 1
        fi
        echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
        names=""
        while IFS= read -r line; do
          line="${line%$'\r'}"                 # tolerate CRLF YAML
          [ -z "${line// }" ] && continue
          if [[ "$line" != *=* ]]; then
            echo "::error::adversarial-review: gate line missing '=' (expected name=command): $line"
            exit 1
          fi
          name="${line%%=*}"; name="${name//[[:space:]]/}"
          if [ -z "$name" ]; then
            echo "::error::adversarial-review: gate line has an empty name: $line"
            exit 1
          fi
          names="${names:+$names,}$name"
        done <<< "$IN_GATES"
        if [ -n "$names" ]; then
          python "$AR_SCRIPTS/gate.py" plan --run "$run_dir" --require "$names"
        else
          python "$AR_SCRIPTS/gate.py" plan --run "$run_dir"
        fi

    - name: Run and record gates
      shell: bash
      env:
        IN_GATES: ${{ inputs.gates }}
        RUN_DIR: ${{ steps.init.outputs.run_dir }}
        AR_SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -uo pipefail
        while IFS= read -r line; do
          line="${line%$'\r'}"                 # tolerate CRLF YAML
          [ -z "${line// }" ] && continue
          # Same shape guard as the plan step: a malformed line is a loud error,
          # never a silently mis-parsed gate.
          if [[ "$line" != *=* ]]; then
            echo "::error::adversarial-review: gate line missing '=' (expected name=command): $line"
            exit 1
          fi
          name="${line%%=*}"; name="${name//[[:space:]]/}"
          cmd="${line#*=}"
          if [ -z "$name" ]; then
            echo "::error::adversarial-review: gate line has an empty name: $line"
            exit 1
          fi
          # A failing command is RECORDED (status FAIL), not fatal here — the
          # aggregator owns the verdict; hiding a failure would defeat it. The
          # command is authored in the trusted workflow file (on fork PRs GitHub
          # takes it from the base repo), and its own $VARS expand inside this
          # inner bash -c exactly as the author intends.
          python "$AR_SCRIPTS/gate.py" run --run "$RUN_DIR" --name "$name" -- bash -c "$cmd" || true
        done <<< "$IN_GATES"

    - name: Independent reviewer panel (only with a key)
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        IN_DIFF_REF: ${{ inputs.diff-ref }}
        RUN_DIR: ${{ steps.init.outputs.run_dir }}
        AR_SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -euo pipefail
        if [ -z "$OPENROUTER_API_KEY" ]; then
          echo "::notice::adversarial-review: no openrouter-api-key provided — skipping the reviewer panel. The verdict will be BLOCKED for missing panel coverage (honest for an un-reviewed change)."
          exit 0
        fi
        # A committed credential in the diff must be caught BEFORE the diff is transmitted to the
        # third-party reviewer panel. Require a recorded, passing 'secrets' gate as the transmission
        # precondition (the NORMAL floor requires it anyway). Without it, skip the panel — the diff is
        # never sent unscanned and the verdict is BLOCKED for missing coverage (honest), not a leak.
        secrets_ok="$(python -c 'import json,os,sys; p=os.path.join(sys.argv[1],"gates","secrets.json"); print("1" if os.path.isfile(p) and json.load(open(p)).get("status")=="PASS" else "0")' "$RUN_DIR")"
        if [ "$secrets_ok" != "1" ]; then
          echo "::warning::adversarial-review: this run's 'secrets' gate is not recorded PASS — skipping the reviewer panel so the diff is NOT transmitted unscanned. Add a secrets scanner to 'gates' (e.g. secrets=gitleaks detect --no-banner --redact --source .); the verdict stays BLOCKED until it passes."
          exit 0
        fi
        # mktemp, not a fixed $RUNNER_TEMP/context.md name — standard temp-file
        # hygiene (no predictable path, honors the runner's temp dir).
        context_file="$(mktemp "${RUNNER_TEMP:-/tmp}/ar-context.XXXXXX")"
        {
          echo "# Change under review (CI)"
          echo
          echo '```diff'
          git diff "$IN_DIFF_REF" || echo "(diff unavailable — check fetch-depth)"
          echo '```'
        } > "$context_file"
        python "$AR_SCRIPTS/panel.py" assign --run "$RUN_DIR"
        python "$AR_SCRIPTS/panel.py" run --run "$RUN_DIR" --context-file "$context_file"

    - name: Compute verdict
      id: verdict
      shell: bash
      env:
        IN_FAIL_ON: ${{ inputs.fail-on }}
        RUN_DIR: ${{ steps.init.outputs.run_dir }}
        AR_SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -uo pipefail
        # GitHub runs composite steps with bash -e; capture aggregate.py's exit code
        # explicitly (|| code=$?) so a FAIL/BLOCKED verdict maps through fail-on and writes
        # the step summary below, instead of aborting this step at the aggregate call.
        code=0
        python "$AR_SCRIPTS/aggregate.py" --run "$RUN_DIR" || code=$?
        case "$code" in
          0) verdict=PASS ;;
          1) verdict=FAIL ;;
          2) verdict=BLOCKED ;;
          *) verdict=ERROR ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        run_dir="$RUN_DIR"
        if [ -n "$run_dir" ] && [ -f "$run_dir/verdict.md" ]; then
          cat "$run_dir/verdict.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$verdict" = FAIL ]; then
          echo "::error::adversarial-review verdict: FAIL (aggregate.py exit 1)"
          exit 1
        elif [ "$verdict" = BLOCKED ]; then
          if [ "$IN_FAIL_ON" = "fail" ]; then
            echo "::warning::adversarial-review verdict: BLOCKED (exit 2) — tolerated because fail-on=fail"
            exit 0
          fi
          echo "::error::adversarial-review verdict: BLOCKED (aggregate.py exit 2)"
          exit 1
        elif [ "$verdict" = ERROR ]; then
          echo "::error::adversarial-review: aggregate.py exited $code"
          exit 1
        fi
        echo "::notice::adversarial-review verdict: PASS"
